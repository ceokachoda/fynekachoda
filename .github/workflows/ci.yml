name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Bundle size check (mobile, advisory)
        # Advisory only in Phase 1; we want awareness of bundle growth but not
        # a hard CI failure until we have a baseline to compare against.
        env:
          EXPO_OFFLINE: '1'
          EXPO_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          EXPO_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
        run: pnpm --filter @fynestudy/mobile exec expo export --dump-sourcemap || true
