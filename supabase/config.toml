# Phase 1 placeholder. Full config (auth, storage, realtime tuning) lands in Checkpoint 2.
# This file exists so `supabase link --project-ref <dev>` finds a local config.

project_id = "fynestudy"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
refresh_token_rotation_enabled = true
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
image_transformation = { enabled = false }

[realtime]
enabled = true

# Public edge functions (no user JWT). Declared here so the CI deploy
# (deploy-functions.yml, which runs `functions deploy` without --no-verify-jwt
# for everything except health) keeps them callable by their own auth gate:
#   - health / server-time : intentionally public endpoints
#   - push-dispatch        : internal sender, gated by X-Internal-Key
#   - push-class-reminders : cron target, gated by X-Cron-Secret
[functions.health]
verify_jwt = false

[functions.server-time]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

[functions.push-class-reminders]
verify_jwt = false
